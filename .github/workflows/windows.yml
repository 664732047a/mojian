name: Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'electron/**'
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'build/**'
      - 'package*.json'
      - 'index.html'
      - 'vite.config.js'
      - '.github/workflows/windows.yml'

concurrency:
  group: windows-installer
  cancel-in-progress: false

jobs:
  build-test-package:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify file storage and platform paths
        run: npm test
      - name: Build Windows x64 installer
        run: npm run package:win
      - name: Install and test the installed Windows application
        shell: pwsh
        run: |
          $installer = Get-ChildItem release -Filter '*-windows-x64-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not created.' }
          $destination = Join-Path $env:RUNNER_TEMP 'Mojian-installed'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList @('/S', "/D=$destination") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer failed: $($process.ExitCode)" }
          $env:MOJIAN_EXECUTABLE = Join-Path $destination 'Mojian.exe'
          if (-not (Test-Path -LiteralPath $env:MOJIAN_EXECUTABLE)) { throw 'Installed app was not found.' }
          $shortcut = Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs\墨笺.lnk'
          if (-not (Test-Path -LiteralPath $shortcut)) { throw 'Start menu shortcut was not created.' }
          node scripts/smoke-test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed Windows app integration checks failed.' }
          node scripts/workspace-smoke-test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Installed Windows workspace checks failed.' }
      - name: Attach tested installer to a draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $installer = Get-ChildItem release -Filter '*-windows-x64-setup.exe' | Select-Object -First 1
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLower()
          $checksums = Join-Path (Resolve-Path release) 'SHA256SUMS-windows-x64.txt'
          [System.IO.File]::WriteAllText($checksums, "$hash  $($installer.Name)`n", [System.Text.Encoding]::ASCII)
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if (-not ($existing | ConvertFrom-Json).isDraft) { throw 'This version is already published. Bump the version before releasing again.' }
            gh release edit $tag --target $env:GITHUB_SHA
            if ($LASTEXITCODE -ne 0) { throw 'Could not update draft target.' }
          } else {
            gh release create $tag --draft --target $env:GITHUB_SHA --title "墨笺 Mojian $tag · Windows 与 Mac" --notes-file .github/release-notes.md
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release.' }
          }
          gh release upload $tag $installer.FullName $checksums --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not attach Windows installer.' }
      - name: Preserve desktop test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-test-reports
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3
